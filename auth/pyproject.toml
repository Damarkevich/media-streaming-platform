[project]
name = "auth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "async-fastapi-jwt-auth>=0.6.6",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.129.1",
    "orjson>=3.11.7",
    "redis>=7.2.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.46",
    "typer>=0.24.0",
    "uvicorn>=0.41.0",
    "werkzeug>=3.1.6",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-exporter-otlp>=1.40.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-sdk>=1.40.0",
    "authlib>=1.6.9",
    "starlette>=0.52.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.scripts]
auth-cli = "src.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[dependency-groups]
dev = ["fastapi[standard]>=0.129.1"]
test = [
    "coverage>=7.13.3",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]


[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
