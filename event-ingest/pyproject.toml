[project]
name = "event-ingest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flasgger>=0.9.7.1",
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.1",
    "gevent>=25.9.1",
    "gunicorn>=23.0.0",
    "kafka-python>=2.3.0",
    "marshmallow>=4.3.0",
    "pydantic-settings>=2.13.1",
]

[dependency-groups]
test = [
    "coverage>=7.13.3",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
