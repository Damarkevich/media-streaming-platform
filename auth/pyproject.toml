[project]
name = "auth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "async-fastapi-jwt-auth>=0.6.6",
    "asyncpg>=0.31.0",
    "fastapi>=0.129.1",
    "orjson>=3.11.7",
    "passlib>=1.7.4",
    "redis>=7.2.0",
    "sqlalchemy[asyncio]>=2.0.46",
    "typer>=0.24.0",
    "uvicorn>=0.41.0",
    "werkzeug>=3.1.6",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.129.1",
]
test = [
    "coverage>=7.13.3",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]


[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
