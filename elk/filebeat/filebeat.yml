filebeat.inputs:
  - type: filestream
    id: docker-container-logs
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*-json.log
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
  - add_host_metadata: ~
  - add_tags:
      tags: ["docker", "container-log"]
  # Extract request_id from JSON structured logs (all services)
  - if:
      regexp:
        message: '"request_id"'
    then:
      - copy_fields:
          fields:
            - from: request_id
              to: correlation_id
          fail_on_error: true
  # nginx-specific processing
  - if:
      equals:
        container.name: movies-nginx
    then:
      - add_tags:
          tags: ["nginx", "edge-proxy"]
      - add_fields:
          target: service
          fields:
            name: movies-nginx
      - dissect:
          tokenizer: '%{nginx.remote_addr} - %{nginx.remote_user} [%{nginx.time_local}] "%{nginx.request}" %{nginx.status} %{nginx.body_bytes_sent} "%{nginx.http_referer}" "%{nginx.http_user_agent}" "%{nginx.http_x_forwarded_for}" "%{nginx.request_id}"'
          field: message
          target_prefix: ""
          ignore_failure: false
      - dissect:
          tokenizer: "%{http.request.method} %{url.original} HTTP/%{http.version}"
          field: nginx.request
          target_prefix: ""
          ignore_failure: true
      - convert:
          fields:
            - from: nginx.status
              to: http.response.status_code
              type: long
            - from: nginx.body_bytes_sent
              type: long
          ignore_missing: true
          fail_on_error: false
  # Application logs processing (auth, api, admin services)
  - if:
      regexp:
        container.name: 'movies-(auth|api|admin)'
    then:
      - add_tags:
          tags: ["app", "service-log"]
      - copy_fields:
          fields:
            - from: request_id
              to: correlation_id
          fail_on_error: true
  # Event-ingest service logs (Flask HTTP service)
  - if:
      equals:
        container.name: movies-event-ingest
    then:
      - add_tags:
          tags: ["event-ingest", "service-log", "http-service"]
      - copy_fields:
          fields:
            - from: request_id
              to: correlation_id
          fail_on_error: true
  # ETL batch services logs
  - if:
      regexp:
        container.name: 'etl-(kafka-clickhouse|postgres-elasticsearch)'
    then:
      - add_tags:
          tags: ["etl", "batch-process"]
      - copy_fields:
          fields:
            - from: batch_id
              to: correlation_id
          fail_on_error: true

output.logstash:
  hosts: ["logstash:5044"]

setup.ilm.enabled: false
setup.template.enabled: false
