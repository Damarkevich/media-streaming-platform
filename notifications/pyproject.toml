[project]
name = "notifications"
version = "0.1.0"
description = "Notifications service for the Movies Streaming Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.129.1",
    "orjson>=3.11.7",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn>=0.41.0",
    "pydantic-settings>=2.9.1",
    "async-fastapi-jwt-auth>=0.6.6",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-exporter-otlp>=1.40.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-sdk>=1.40.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "aiokafka>=0.12.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[dependency-groups]
dev = ["fastapi[standard]>=0.129.1"]
test = [
    "coverage>=7.13.3",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
