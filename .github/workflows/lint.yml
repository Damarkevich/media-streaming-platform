name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ruff:
    name: Ruff Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - async_api
          - auth
          - billing
          - event_ingest
          - etl-kafka-clickhouse
          - etl-postgres-elasticsearch
          - movies_admin
          - ugc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ruff
        run: uv tool install ruff

      - name: Run ruff check
        run: |
          cd ${{ matrix.service }}
          ruff check .
        continue-on-error: false

      - name: Run ruff format check
        run: |
          cd ${{ matrix.service }}
          ruff format --check .
        continue-on-error: false
