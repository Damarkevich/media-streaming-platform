services:
  movies-db:
    container_name: movies-db
    image: postgres:18.1
    volumes:
      - movies_admin_db:/var/lib/postgresql
      - ./database_dump.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  movies-elasticsearch:
    container_name: movies-elasticsearch
    image: elasticsearch:9.2.3
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - movies_elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    ports:
      - "127.0.0.1:9200:9200"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: curl -s http://movies-elasticsearch:9200 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  
  movies-redis:
    container_name: movies-redis
    image: redis:8.4.0
    command: redis-server --appendonly yes
    volumes:
      - movies_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  movies-etl-service:
    container_name: movies-etl-service
    build: ./etl_service
    restart: unless-stopped
    depends_on:
      movies-db:
        condition: service_healthy
      movies-elasticsearch:
        condition: service_healthy
      movies-redis:
        condition: service_healthy
    env_file:
      - .env

  jaeger:
    container_name: movies-jaeger
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "4317:4317"
      - "4318:4318"

  movies-auth:
    container_name: movies-auth
    build: ./auth
    restart: unless-stopped
    depends_on:
      movies-db:
        condition: service_healthy
      movies-redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -H 'X-Request-Id: healthcheck' http://localhost:8000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  movies-admin:
    container_name: movies-admin
    build: ./movies_admin
    restart: unless-stopped
    volumes:
      - movies_admin_static:/opt/movies_admin/static
    depends_on:
      movies-db:
        condition: service_healthy
      movies-auth:
        condition: service_healthy
    env_file:
      - .env

  movies-async-api:
    container_name: movies-async-api
    build: ./async_api
    restart: unless-stopped
    depends_on:
      movies-elasticsearch:
        condition: service_healthy
      movies-redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      movies-auth:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -H 'X-Request-Id: healthcheck' http://localhost:8000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s



  nginx:
    container_name: movies-nginx
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs:/etc/nginx/conf.d:ro
      - movies_admin_static:/opt/movies_admin/static
    depends_on:
      movies-auth:
        condition: service_healthy
      movies-admin:
        condition: service_started
      movies-async-api:
        condition: service_healthy
      movies-elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  movies_admin_db:
  movies_admin_static:
  movies_redis_data:
  movies_elasticsearch_data:
