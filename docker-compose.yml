services:
  movies-db:
    container_name: movies-db
    image: postgres:18.1
    volumes:
      - movies_admin_db:/var/lib/postgresql
      - ./database_dump.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  movies-elasticsearch:
    container_name: movies-elasticsearch
    image: elasticsearch:9.2.3
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - movies_elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    ports:
      - "9200:9200"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: curl -s http://movies-elasticsearch:9200 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  
  movies-redis:
    container_name: movies-redis
    image: redis:8.4.0
    command: redis-server --appendonly yes
    volumes:
      - movies_redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  movies-etl-service:
    container_name: movies-etl-service
    build: ./etl_service
    restart: always
    depends_on:
      movies-db:
        condition: service_healthy
      movies-elasticsearch:
        condition: service_healthy
      movies-redis:
        condition: service_healthy
    env_file:
      - .env

  movies-admin:
    container_name: movies-admin
    build: ./movies_admin
    restart: always
    volumes:
      - movies_admin_static:/opt/movies_admin/static
    depends_on:
      movies-db:
        condition: service_healthy
    env_file:
      - .env

  nginx:
    container_name: movies-nginx
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs:/etc/nginx/conf.d:ro
      - movies_admin_static:/opt/movies_admin/static
    depends_on:
      - movies-admin
    ports:
      - "80:80"

volumes:
  movies_admin_db:
  movies_admin_static:
  movies_redis_data:
  movies_elasticsearch_data:
