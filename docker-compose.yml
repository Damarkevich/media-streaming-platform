services:
  movies-db:
    container_name: movies-db
    image: postgres:18.1
    volumes:
      - movies_admin_db:/var/lib/postgresql
      - ./database_dump.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  movies-elasticsearch:
    container_name: movies-elasticsearch
    image: elasticsearch:9.3.3
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - movies_elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    ports:
      - "127.0.0.1:9200:9200"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: curl -s http://movies-elasticsearch:9200 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  elk-elasticsearch:
    container_name: movies-elk-elasticsearch
    image: elasticsearch:9.3.3
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elk_elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    ports:
      - "127.0.0.1:9201:9200"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: curl -s http://elk-elasticsearch:9200 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  kibana:
    container_name: movies-kibana
    image: kibana:9.3.3
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_HOSTS=http://elk-elasticsearch:9200
    depends_on:
      elk-elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  logstash:
    container_name: movies-logstash
    image: logstash:9.3.3
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elk-elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:5044:5044"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  filebeat:
    container_name: movies-filebeat
    image: docker.elastic.co/beats/filebeat:9.3.3
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      logstash:
        condition: service_healthy
    restart: unless-stopped

  movies-redis:
    container_name: movies-redis
    image: redis:8.4.0
    command: redis-server --appendonly yes
    volumes:
      - movies_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  movies-mongodb:
    container_name: movies-mongodb
    image: mongo:8.2.7
    entrypoint:
      [
        "bash",
        "-lc",
        "cp /run/secrets/mongodb-keyfile /tmp/mongodb-keyfile && chown mongodb:mongodb /tmp/mongodb-keyfile && chmod 400 /tmp/mongodb-keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongodb-keyfile",
      ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-mongo_password}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-ugc_database}
    volumes:
      - movies_mongodb_data:/data/db
      - ./configs/mongodb-keyfile:/run/secrets/mongodb-keyfile:ro
    ports:
      - "127.0.0.1:${MONGODB_EXTERNAL_PORT:-27017}:27017"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin?replicaSet=rs0 --quiet --eval 'db.hello().isWritablePrimary' | grep true >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  movies-mongodb-rs-init:
    image: mongo:8.2.7
    depends_on:
      movies-mongodb:
        condition: service_started
    restart: "no"
    entrypoint:
      [
        "bash",
        "-lc",
        "until mongosh mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@movies-mongodb:27017/admin --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1 >/dev/null; do sleep 1; done; mongosh mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@movies-mongodb:27017/admin --eval \"const cfg = {_id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }]}; try { const current = rs.conf(); if (current.members[0].host !== cfg.members[0].host) { cfg.version = current.version + 1; rs.reconfig(cfg, { force: true }); } } catch (e) { rs.initiate(cfg); }\"",
      ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-mongo_password}

  kafka-0:
    image: bitnamilegacy/kafka:3.4
    ports:
      - "9094:9094"
    env_file:
      - .env
    environment:
      - KAFKA_CFG_NODE_ID=${KAFKA_CFG_NODE_ID_0}
      - KAFKA_ENABLE_KRAFT=${KAFKA_ENABLE_KRAFT}
      - ALLOW_PLAINTEXT_LISTENER=${ALLOW_PLAINTEXT_LISTENER}
      - KAFKA_KRAFT_CLUSTER_ID=${KAFKA_KRAFT_CLUSTER_ID}
      - KAFKA_CFG_PROCESS_ROLES=${KAFKA_CFG_PROCESS_ROLES}
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=${KAFKA_CFG_CONTROLLER_LISTENER_NAMES}
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=${KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP}
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=${KAFKA_CFG_CONTROLLER_QUORUM_VOTERS}
      - KAFKA_CFG_LISTENERS=${KAFKA_CFG_LISTENERS_0}
      - KAFKA_CFG_ADVERTISED_LISTENERS=${KAFKA_CFG_ADVERTISED_LISTENERS_0}
    volumes:
      - kafka_0_data:/bitnami/kafka

  kafka-1:
    image: bitnamilegacy/kafka:3.4
    ports:
      - "9095:9095"
    env_file:
      - .env
    environment:
      - KAFKA_CFG_NODE_ID=${KAFKA_CFG_NODE_ID_1}
      - KAFKA_ENABLE_KRAFT=${KAFKA_ENABLE_KRAFT}
      - ALLOW_PLAINTEXT_LISTENER=${ALLOW_PLAINTEXT_LISTENER}
      - KAFKA_KRAFT_CLUSTER_ID=${KAFKA_KRAFT_CLUSTER_ID}
      - KAFKA_CFG_PROCESS_ROLES=${KAFKA_CFG_PROCESS_ROLES}
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=${KAFKA_CFG_CONTROLLER_LISTENER_NAMES}
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=${KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP}
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=${KAFKA_CFG_CONTROLLER_QUORUM_VOTERS}
      - KAFKA_CFG_LISTENERS=${KAFKA_CFG_LISTENERS_1}
      - KAFKA_CFG_ADVERTISED_LISTENERS=${KAFKA_CFG_ADVERTISED_LISTENERS_1}
    volumes:
      - kafka_1_data:/bitnami/kafka

  kafka-2:
    image: bitnamilegacy/kafka:3.4
    ports:
      - "9096:9096"
    env_file:
      - .env
    environment:
      - KAFKA_CFG_NODE_ID=${KAFKA_CFG_NODE_ID_2}
      - KAFKA_ENABLE_KRAFT=${KAFKA_ENABLE_KRAFT}
      - ALLOW_PLAINTEXT_LISTENER=${ALLOW_PLAINTEXT_LISTENER}
      - KAFKA_KRAFT_CLUSTER_ID=${KAFKA_KRAFT_CLUSTER_ID}
      - KAFKA_CFG_PROCESS_ROLES=${KAFKA_CFG_PROCESS_ROLES}
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=${KAFKA_CFG_CONTROLLER_LISTENER_NAMES}
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=${KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP}
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=${KAFKA_CFG_CONTROLLER_QUORUM_VOTERS}
      - KAFKA_CFG_LISTENERS=${KAFKA_CFG_LISTENERS_2}
      - KAFKA_CFG_ADVERTISED_LISTENERS=${KAFKA_CFG_ADVERTISED_LISTENERS_2}
    volumes:
      - kafka_2_data:/bitnami/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.0
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=${KAFKA_UI_BOOTSTRAP_SERVERS}
      - KAFKA_CLUSTERS_0_NAME=${KAFKA_UI_CLUSTER_NAME}

  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    hostname: zookeeper
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q 'Mode' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  clickhouse-node1:
    image: clickhouse/clickhouse-server:23
    container_name: clickhouse-node1
    hostname: clickhouse-node1
    env_file:
      - .env
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./data/node1:/etc/clickhouse-server
      - clickhouse_node1_data:/var/lib/clickhouse
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$${CLICKHOUSE_DEFAULT_PASSWORD}\" --query 'SELECT 1' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  clickhouse-node2:
    image: clickhouse/clickhouse-server:23
    container_name: clickhouse-node2
    hostname: clickhouse-node2
    env_file:
      - .env
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - ./data/node2:/etc/clickhouse-server
      - clickhouse_node2_data:/var/lib/clickhouse
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$${CLICKHOUSE_DEFAULT_PASSWORD}\" --query 'SELECT 1' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  clickhouse-node3:
    image: clickhouse/clickhouse-server:23
    container_name: clickhouse-node3
    hostname: clickhouse-node3
    env_file:
      - .env
    ports:
      - "8125:8123"
      - "9002:9000"
    volumes:
      - ./data/node3:/etc/clickhouse-server
      - clickhouse_node3_data:/var/lib/clickhouse
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$${CLICKHOUSE_DEFAULT_PASSWORD}\" --query 'SELECT 1' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  clickhouse-node4:
    image: clickhouse/clickhouse-server:23
    container_name: clickhouse-node4
    hostname: clickhouse-node4
    env_file:
      - .env
    ports:
      - "8126:8123"
      - "9003:9000"
    volumes:
      - ./data/node4:/etc/clickhouse-server
      - clickhouse_node4_data:/var/lib/clickhouse
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$${CLICKHOUSE_DEFAULT_PASSWORD}\" --query 'SELECT 1' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped


  etl-postgres-elasticsearch:
    container_name: etl-postgres-elasticsearch
    build: ./etl-postgres-elasticsearch
    restart: unless-stopped
    depends_on:
      movies-db:
        condition: service_healthy
      movies-elasticsearch:
        condition: service_healthy
      movies-redis:
        condition: service_healthy
    env_file:
      - .env

  etl-kafka-clickhouse:
    container_name: etl-kafka-clickhouse
    build: ./etl-kafka-clickhouse
    restart: unless-stopped
    depends_on:
      kafka-0:
        condition: service_started
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      clickhouse-node1:
        condition: service_healthy
      clickhouse-node2:
        condition: service_healthy
      clickhouse-node3:
        condition: service_healthy
      clickhouse-node4:
        condition: service_healthy
    env_file:
      - .env

  sentry-db:
    container_name: movies-sentry-db
    image: postgres:16
    environment:
      POSTGRES_USER: ${GLITCHTIP_DB_USER}
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
      POSTGRES_DB: ${GLITCHTIP_DB_NAME}
    volumes:
      - sentry_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GLITCHTIP_DB_USER} -d ${GLITCHTIP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  glitchtip:
    container_name: movies-glitchtip
    image: glitchtip/glitchtip:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL}
      REDIS_URL: ${GLITCHTIP_REDIS_URL}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
      DEFAULT_AUTO_FIELD: ${GLITCHTIP_DEFAULT_AUTO_FIELD}
      CELERY_WORKER_AUTOSCALE: ${GLITCHTIP_CELERY_WORKER_AUTOSCALE}
    ports:
      - "127.0.0.1:8007:8000"
    depends_on:
      sentry-db:
        condition: service_healthy
      movies-redis:
        condition: service_healthy
    restart: unless-stopped

  glitchtip-worker:
    container_name: movies-glitchtip-worker
    image: glitchtip/glitchtip:latest
    command: ./bin/run-celery-with-beat.sh
    env_file:
      - .env
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL}
      REDIS_URL: ${GLITCHTIP_REDIS_URL}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
      DEFAULT_AUTO_FIELD: ${GLITCHTIP_DEFAULT_AUTO_FIELD}
      CELERY_WORKER_AUTOSCALE: ${GLITCHTIP_CELERY_WORKER_AUTOSCALE}
    depends_on:
      sentry-db:
        condition: service_healthy
      movies-redis:
        condition: service_healthy
    restart: unless-stopped

  jaeger:
    container_name: movies-jaeger
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "4317:4317"
      - "4318:4318"

  movies-auth:
    container_name: movies-auth
    build: ./auth
    restart: unless-stopped
    depends_on:
      movies-db:
        condition: service_healthy
      movies-redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -H 'X-Request-Id: healthcheck' http://localhost:8000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  movies-admin:
    container_name: movies-admin
    build: ./movies_admin
    restart: unless-stopped
    volumes:
      - movies_admin_static:/opt/movies_admin/static
    depends_on:
      movies-db:
        condition: service_healthy
      movies-auth:
        condition: service_healthy
    env_file:
      - .env

  movies-async-api:
    container_name: movies-async-api
    build: ./async_api
    restart: unless-stopped
    depends_on:
      movies-elasticsearch:
        condition: service_healthy
      movies-redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      movies-auth:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -H 'X-Request-Id: healthcheck' http://localhost:8000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  movies-event-ingest:
    container_name: movies-event-ingest
    build: ./event_ingest
    restart: unless-stopped
    depends_on:
      kafka-0:
        condition: service_started
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8000/apidocs/ >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  nginx:
    container_name: movies-nginx
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs:/etc/nginx/conf.d:ro
      - movies_admin_static:/opt/movies_admin/static
    depends_on:
      movies-auth:
        condition: service_healthy
      movies-admin:
        condition: service_started
      movies-async-api:
        condition: service_healthy
      movies-event-ingest:
        condition: service_healthy
      movies-elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"


volumes:
  movies_admin_db:
  movies_admin_static:
  movies_redis_data:
  movies_mongodb_data:
  movies_elasticsearch_data:
  elk_elasticsearch_data:
  filebeat_data:
  kafka_0_data:
  kafka_1_data:
  kafka_2_data:
  zookeeper_data:
  zookeeper_datalog:
  clickhouse_node1_data:
  clickhouse_node2_data:
  clickhouse_node3_data:
  clickhouse_node4_data:
  sentry_db_data:
