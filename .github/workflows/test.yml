name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test ${{ matrix.service }} on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
            experimental: false
          - python-version: '3.14'
            experimental: true
        service:
          - async_api
          - auth
          - billing
          - event_ingest
          - ugc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ matrix.service }}/pyproject.toml"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          uv sync --group test

      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        env:
          AUTHJWT_SECRET_KEY: test_secret_key_at_least_32_characters_long_for_testing
          POSTGRES_PASSWORD: test_password
          SESSION_SECRET_KEY: test_session_secret_key_at_least_32_characters_long
          GOOGLE_CLIENT_ID: test_google_client_id
          GOOGLE_CLIENT_SECRET: test_google_client_secret
        run: |
          uv run python -m coverage run -m pytest -v
          uv run python -m coverage report

  test-movies-admin:
    name: Test movies_admin on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'
            experimental: false
          - python-version: '3.14'
            experimental: true

    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: movies_database
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "movies_admin/pyproject.toml"

      - name: Install dependencies
        working-directory: movies_admin
        run: |
          uv sync

      - name: Run billing admin tests
        working-directory: movies_admin
        env:
          AUTH_API_LOGIN_URL: http://movies-auth:8000/api/v1/auth/api-login
          POSTGRES_DB: movies_database
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          SQL_HOST: localhost
          SQL_PORT: 5432
          BILLING_POSTGRES_PASSWORD: test_password
          BILLING_SQL_HOST: localhost
        run: |
          uv run python manage.py test billing.tests.test_admin_refunds -v 2
