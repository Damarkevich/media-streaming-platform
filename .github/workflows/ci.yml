name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - async_api
          - auth
          - event_ingest
          - etl-kafka-clickhouse
          - etl-postgres-elasticsearch
          - ugc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ruff
        run: uv tool install ruff

      - name: Run ruff check
        run: |
          cd ${{ matrix.service }}
          ruff check .

      - name: Run ruff format check
        run: |
          cd ${{ matrix.service }}
          ruff format --check .

  test:
    name: Test ${{ matrix.service }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14', '3.15']
        service:
          - async_api
          - auth
          - event_ingest
          - ugc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ matrix.service }}/pyproject.toml"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          uv pip install --system -e .[test]

      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: |
          python -m coverage run -m pytest -v
          python -m coverage report
