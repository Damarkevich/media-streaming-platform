[project]
name = "movies-admin"
version = "0.1.0"
description = "Django-based admin panel for managing movie databases."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "django-debug-toolbar>=6.1.0",
    "django-split-settings>=1.3.2",
    "djangorestframework>=3.16.1",
    "drf-spectacular>=0.29.0",
    "drf-standardized-errors>=0.15.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
]
