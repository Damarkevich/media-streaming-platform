    }

    # TODO: WebSocket upgrade route for future ws-notify service
    # location /api/v1/ws/notifications {
    #     proxy_pass http://movies-ws-notify:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Request-Id $proxy_request_id;
    # }

    location /api {
        proxy_pass http://movies-async-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $proxy_request_id;
    }

    location / {
        try_files $uri @movies_admin;
    }

    error_page  404              /404.html;
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}
