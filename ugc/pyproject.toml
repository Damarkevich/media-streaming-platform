[project]
name = "ugc"
version = "0.1.0"
description = "User-Generated Content service (bookmarks, ratings, reviews) for the Movies Streaming Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic-settings>=2.12.0",
    "uvicorn>=0.40.0",
    "pymongo>=4.16.0",
    "redis>=7.1.0",
    "python-jose[cryptography]>=3.5.0",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-exporter-otlp>=1.40.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-sdk>=1.40.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.128.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "coverage>=7.13.3",
]
