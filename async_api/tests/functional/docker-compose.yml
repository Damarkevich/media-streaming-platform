services:
  test-elasticsearch:
    container_name: test-elasticsearch
    image: elasticsearch:9.2.3
    environment:
      - discovery.type=${ES_DISCOVERY_TYPE}
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
      - xpack.security.enabled=${ES_XPACK_SECURITY_ENABLED}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    ports:
      - "9200:9200"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: curl -s http://test-elasticsearch:9200 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  test-redis:
    container_name: test-redis
    image: redis:8.4.0
    command: redis-server
    ports:
      - "6379:6379"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
  test-fastapi:
    container_name: test-fastapi
    build: ../../.
    image: fastapi-image
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      AUTHJWT_SECRET_KEY: ${AUTHJWT_SECRET_KEY:-test-authjwt-secret-key-more-than-32}
      AUTHJWT_ALGORITHM: ${AUTHJWT_ALGORITHM:-HS256}
      SUBSCRIBER_ROLE_NAME: ${SUBSCRIBER_ROLE_NAME:-subscriber}
      ADMIN_ROLE_NAME: ${ADMIN_ROLE_NAME:-admin}
    volumes:
      - coverage_data:/coverage
      - ./.coveragerc:/app/.coveragerc
      - ./scripts:/app/tests/functional/scripts
    depends_on:
      test-elasticsearch:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    command: ["sh", "/app/tests/functional/scripts/run_test_fastapi.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H 'X-Request-Id: healthcheck' http://localhost:8000/api/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
  tests:
    container_name: tests
    image: fastapi-image
    volumes:
      - ../../tests:/tests
      - ../../pyproject.toml:/app/pyproject.toml
      - coverage_data:/coverage
      - ./htmlcov:/app/htmlcov
      - ./.coveragerc:/app/.coveragerc
      - ./scripts:/app/tests/functional/scripts
    working_dir: /tests/functional
    env_file:
      - .env
    environment:
      AUTHJWT_SECRET_KEY: ${AUTHJWT_SECRET_KEY:-test-authjwt-secret-key-more-than-32}
      AUTHJWT_ALGORITHM: ${AUTHJWT_ALGORITHM:-HS256}
      SUBSCRIBER_ROLE_NAME: ${SUBSCRIBER_ROLE_NAME:-subscriber}
      ADMIN_ROLE_NAME: ${ADMIN_ROLE_NAME:-admin}
    depends_on:
      test-elasticsearch:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-fastapi:
        condition: service_healthy
    command: ["sh", "/app/tests/functional/scripts/run_functional_tests.sh"]

  coverage-report:
    container_name: coverage-report
    image: fastapi-image
    volumes:
      - coverage_data:/coverage
      - ./htmlcov:/app/htmlcov
      - ./.coveragerc:/app/.coveragerc
      - ./scripts:/app/tests/functional/scripts
    command: ["sh", "/app/tests/functional/scripts/generate_coverage_report.sh"]

volumes:
  coverage_data:
