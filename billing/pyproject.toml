[project]
name = "billing"
version = "0.1.0"
description = "Stripe billing service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.129.1",
    "orjson>=3.11.7",
    "pydantic-settings>=2.11.0",
    "sqlalchemy[asyncio]>=2.0.46",
    "stripe>=15.2.0",
    "uvicorn>=0.41.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[dependency-groups]
dev = ["fastapi[standard]>=0.129.1"]
test = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/functional"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
