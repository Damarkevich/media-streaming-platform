input {
  beats {
    port => 5044
  }
}

filter {
  if [message] =~ "^\\s*$" {
    drop { }
  }
  
  # Normalize request_id from various sources
  # nginx provides request_id in the log format
  if "nginx" in [tags] or [container][name] == "movies-nginx" {
    if [nginx][request_id] {
      mutate {
        add_field => { "request_id" => "%{[nginx][request_id]}" }
      }
    }
  }
  # App logs already have request_id in JSON if they have one
  # Filebeat will parse it as a top-level field
  # Just ensure it's there, copy correlation_id if created by Filebeat
  if [correlation_id] and ![request_id] {
    mutate {
      rename => { "correlation_id" => "request_id" }
    }
  }
}

output {
  # nginx logs to dedicated index
  if "nginx" in [tags] or [container][name] == "movies-nginx" {
    elasticsearch {
      hosts => ["http://elk-elasticsearch:9200"]
      index => "nginx-logs-%{+YYYY.MM.dd}"
    }
  }
  # app service logs to app-logs index with request_id
  else if "app" in [tags] or [container][name] =~ /movies-(auth|api|admin)/ {
    elasticsearch {
      hosts => ["http://elk-elasticsearch:9200"]
      index => "app-logs-%{+YYYY.MM.dd}"
    }
  }
  # event-ingest service logs to event-ingest index
  else if "event-ingest" in [tags] or [container][name] == "movies-event-ingest" {
    elasticsearch {
      hosts => ["http://elk-elasticsearch:9200"]
      index => "event-ingest-logs-%{+YYYY.MM.dd}"
    }
  }
  # ETL batch process logs to etl index with batch_id
  else if "etl" in [tags] or [container][name] =~ /etl-(kafka-clickhouse|postgres-elasticsearch)/ {
    elasticsearch {
      hosts => ["http://elk-elasticsearch:9200"]
      index => "etl-logs-%{+YYYY.MM.dd}"
    }
  }
  # all other container logs to docker-logs index
  else {
    elasticsearch {
      hosts => ["http://elk-elasticsearch:9200"]
      index => "docker-logs-%{+YYYY.MM.dd}"
    }
  }
}
