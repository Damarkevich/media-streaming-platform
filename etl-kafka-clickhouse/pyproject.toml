[project]
name = "etl-kafka-clickhouse"
version = "0.1.0"
description = "ETL service for moving events from Kafka to ClickHouse"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "clickhouse-driver>=0.2.10",
    "kafka-python>=2.3.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]
